[project]
name = "jarvis-chess"
version = "0.1.0"
description = "MCP server for honest chess game review: Stockfish and the rules supply the facts, the LLM narrates"
requires-python = ">=3.11"
dependencies = ["chess==1.11.2", "mcp==1.30.0"]

[project.scripts]
jarvis-chess = "jarvis_chess.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]


[tool.setuptools.package-data]

jarvis_chess = ["openings.tsv"]
